name: ci

on:
  push:
  pull_request:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Install task
        run: |
          set -eux
          go install github.com/go-task/task/v3/cmd/task@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install QEMU + ISO tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 grub-pc-bin grub-efi-amd64-bin xorriso mtools linux-image-generic

      - name: Build ISO through Taskfile
        run: |
          set -eux
          task clean
          task iso

      - name: Check ISO boot entries
        run: |
          set -eux
          xorriso -indev build/goos.iso -report_el_torito plain | tee build/el-torito.txt
          grep -q "BIOS" build/el-torito.txt
          grep -q "UEFI" build/el-torito.txt

      - name: Boot smoke test from ISO (expects READY)
        run: |
          set -euxo pipefail

          # Smoke test the kernel+initramfs produced by task iso.
          qemu-system-x86_64 -m 1024 -nographic -accel tcg \
            -kernel build/vmlinuz \
            -initrd build/initramfs.cpio \
            -append "console=ttyS0 goos.shell=0" \
            > build/boot.log 2>&1 &
          QEMU_PID=$!

          # Wait up to 120s for READY
          for i in $(seq 1 120); do
            if grep -q READY build/boot.log 2>/dev/null; then
              echo "READY found, stopping QEMU"
              kill $QEMU_PID 2>/dev/null || true
              wait $QEMU_PID 2>/dev/null || true
              cat build/boot.log
              exit 0
            fi
            if ! kill -0 $QEMU_PID 2>/dev/null; then
              echo "QEMU exited unexpectedly"
              cat build/boot.log
              exit 1
            fi
            sleep 1
          done

          echo "Timeout waiting for READY"
          kill $QEMU_PID 2>/dev/null || true
          cat build/boot.log
          exit 1


      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: goos-iso
          path: |
            build/goos.iso
            build/vmlinuz
            build/initramfs.cpio
            build/el-torito.txt
            build/boot.log
